# oc-backup metrics (OPF-4) - written by /usr/local/bin/oc-backup.sh into /var/lib/openclaw-metrics/backup.json
# Server path: /etc/zabbix/zabbix_agentd.d/openclaw-backup.conf
UserParameter=custom.openclaw.backup.age_hours,/usr/bin/jq -r '((now - .lastOkEpoch) / 3600 | floor)' /var/lib/openclaw-metrics/backup.json
UserParameter=custom.openclaw.backup.sizeMb,/usr/bin/jq -r .sizeMb /var/lib/openclaw-metrics/backup.json
UserParameter=custom.openclaw.backup.status,/usr/bin/jq -r .status /var/lib/openclaw-metrics/backup.json
UserParameter=custom.openclaw.restore.status,/usr/bin/jq -r .status /var/lib/openclaw-metrics/restore-test.json