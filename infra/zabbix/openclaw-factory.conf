# agent factory drift metric (OPF-8, E4) - written by /usr/local/bin/oc-factory-drift.sh into /var/lib/openclaw-metrics/factory-drift.json
# Server path: /etc/zabbix/zabbix_agentd.d/openclaw-factory.conf
UserParameter=custom.openclaw.factory.drift,/usr/bin/jq -r .status /var/lib/openclaw-metrics/factory-drift.json