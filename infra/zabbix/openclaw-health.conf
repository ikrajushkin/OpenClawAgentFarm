# OpenClaw health metrics (OPF-6) - refreshed by /usr/local/bin/openclaw-health-refresh.sh
# Server path: /etc/zabbix/zabbix_agentd.d/openclaw-health.conf
UserParameter=custom.openclaw.gateway.active,/usr/bin/systemctl is-active -q openclaw-gateway && /bin/echo 1 || /bin/echo 0
UserParameter=custom.openclaw.cron.jobs,/usr/bin/jq -r .cronJobs /var/lib/openclaw-metrics/health.json
UserParameter=custom.openclaw.cron.errors,/usr/bin/jq -r .cronErrors /var/lib/openclaw-metrics/health.json
UserParameter=custom.openclaw.heartbeat.main,/usr/bin/jq -r .heartbeat.main /var/lib/openclaw-metrics/health.json
UserParameter=custom.openclaw.heartbeat.ksu,/usr/bin/jq -r .heartbeat.ksu /var/lib/openclaw-metrics/health.json
UserParameter=custom.openclaw.heartbeat.service,/usr/bin/jq -r .heartbeat.service /var/lib/openclaw-metrics/health.json