# OpenClaw usage metrics (OPF-6) - refreshed by /usr/local/bin/openclaw-usage-refresh.sh
# Server path: /etc/zabbix/zabbix_agentd.d/openclaw.conf
UserParameter=custom.openclaw.usage.cost,/usr/bin/jq -r .totals.totalCost /var/lib/openclaw-metrics/usage.json
UserParameter=custom.openclaw.usage.tokens,/usr/bin/jq -r .totals.totalTokens /var/lib/openclaw-metrics/usage.json
UserParameter=custom.openclaw.usage.input,/usr/bin/jq -r .totals.input /var/lib/openclaw-metrics/usage.json
UserParameter=custom.openclaw.usage.output,/usr/bin/jq -r .totals.output /var/lib/openclaw-metrics/usage.json
UserParameter=custom.openclaw.usage.cache_read,/usr/bin/jq -r .totals.cacheRead /var/lib/openclaw-metrics/usage.json